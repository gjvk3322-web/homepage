<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://my.dolbommat.com/quote.html">
<title>돌봄매트 맞춤 견적</title>
<!--
  www.dolbommat.com/quote.html → my.dolbommat.com/quote.html 이동 전용 페이지 (2026-09-09)
  · 운영 견적 페이지는 my.dolbommat.com/quote.html 하나. 이 파일은 옛 URL로 들어온 방문자를 넘기기만 함.
  · 쿼리(utm_*, gclid, fbclid, dim, prod, ben, sr, ch, phone, name …)와 해시는 그대로 붙여서 이동 → 광고 유입 정보와 견적 링크가 유지됨.
  · GA4·메타·카카오·네이버 태그를 일부러 넣지 않음: 이 페이지에서 page_view/PageView가 한 번 더 찍히면
    이동 뒤 my.dolbommat.com에서 찍히는 것과 중복되고, 이탈률·세션 수가 왜곡됨. (홈페이지 다른 페이지의 태그는 그대로.)
  · 루프 방지: 현재 호스트가 이미 my.dolbommat.com이면 이동하지 않음 (파일이 실수로 dashboard 레포에 들어가도 안전).
-->
<script>
(function(){
  var TARGET_HOST='my.dolbommat.com', TARGET='https://'+TARGET_HOST+'/quote.html';
  if(location.hostname===TARGET_HOST){return;}
  var dest=TARGET+(location.search||'')+(location.hash||'');
  location.replace(dest);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://my.dolbommat.com/quote.html"></noscript>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f5f3ee;color:#1a1a1a}
.box{text-align:center;padding:24px}
a{color:#2E7D32;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <p>견적 페이지로 이동 중입니다…</p>
  <p><a id="go" href="https://my.dolbommat.com/quote.html">바로 가기</a></p>
</div>
<script>
(function(){var a=document.getElementById('go');if(a){a.href='https://my.dolbommat.com/quote.html'+(location.search||'')+(location.hash||'')}})();
</script>
</body>
</html>
